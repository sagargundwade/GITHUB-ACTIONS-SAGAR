name : build and push

on : workflow_dispatch

jobs : 
   buildandpush :
     runs-on : ubuntu-latest
     steps :
       - name:  putting code on runner
         run :  git clone https://github.com/sagargundwade/GITHUB-ACTIONS-SAGAR.git

       - name: build docker image   
         run: |
           cd  GITHUB-ACTIONS-SAGAR/.github/workflows
           docker build -t myimage .
       - name: login to docker hub
         run: echo ${{secrets.DOCKERHUB_PASSWORD}} | docker login -u ${{vars.DOCKERHUB_USERNAME}} --password-stdin
       
       - name: tag and push
         run:  |
           docker images
           docker tag myimage:latest ${{vars.DOCKERHUB_USERNAME}}/practice:v1
           docker push ${{secrets.DOCKERHUB_USERNAME}}/practice:latest


name : build and push

on : workflow_dispatch

jobs : 
   build and push :
     runs-on : ubuntu-latest
     steps :
       - name:  putting code on runner
         run :  git clone https://github.com/sagargundwade/GITHUB-ACTIONS-SAGAR.git

       - name: build docker image   
         run: |
           cd  GITHUB-ACTIONS-SAGAR/.github/workflows
           docker build -t myimage .
       - name: login to docker hub
         run: echo $ {{secrets.dockerhub_password}} | docker login -u {{var.dockerhub_username}} --password-stdin



name : build and push

on : workflow_dispatch

jobs : 
   buildandpush :
     runs-on : self-hosted
     steps :
        
       - name: Checkout code
         uses: actions/checkout@v4

       - name: build docker image   
         run: |
           cd  GITHUB-ACTIONS-SAGAR/
           docker build -t myimage .
       - name: login to docker hub
         run: echo ${{secrets.DOCKERHUB_PASSWORD}} | docker login -u ${{vars.DOCKERHUB_USERNAME}} --password-stdin
       
       - name: tag and push
         run:  |
           docker images
           docker tag myimage:latest ${{vars.DOCKERHUB_USERNAME}}/practice:v1
           docker push ${{vars.DOCKERHUB_USERNAME}}/practice:v1

